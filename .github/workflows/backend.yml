name: Backend E2
on:
  push:
    branches: [main, 'fix/**', 'codex/deploy-render']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: stocksmart_ci_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      STOCKSMART_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/stocksmart_ci_test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r requirements-test.lock
          pip install --no-deps -e .
          pip check
      - name: PostgreSQL 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release; echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo 'STOCKSMART_PG_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"
      - name: Static analysis
        run: |
          ruff check --config pyproject.toml . ../scripts
          ruff format --check --config pyproject.toml . ../scripts
      - name: PostgreSQL tests and clean migrations
        run: pytest -q --junitxml=../test-results-${{ matrix.postgres }}.xml
      - name: Audit locked runtime dependencies
        run: pip-audit -r requirements.lock --no-deps --disable-pip
      - name: Build production wheel
        run: pip wheel --no-deps --wheel-dir /tmp/stocksmart-wheel .
      - name: Installed production package startup
        env:
          STOCKSMART_BUILD_SHA: ${{ github.sha }}
        run: |
          python -m venv /tmp/stocksmart-render-runtime
          /tmp/stocksmart-render-runtime/bin/python -m pip install --require-hashes -r requirements.lock
          /tmp/stocksmart-render-runtime/bin/python -m pip install --no-deps /tmp/stocksmart-wheel/stocksmart_backend-*.whl
          /tmp/stocksmart-render-runtime/bin/python -m pip check
          /tmp/stocksmart-render-runtime/bin/python -I ../scripts/check_render_startup.py
      - name: Backup container build
        if: matrix.postgres == '18'
        working-directory: .
        run: docker build -t stocksmart-backup:ci --file backend/Dockerfile backend
