[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksmart-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.3,<6",
  "boto3>=1.40,<2",
  "PyJWT>=2.10,<3",
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.1; platform_system == 'Windows'",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "pip-audit>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scraper*"]

[tool.setuptools.package-data]
scraper = ["certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
